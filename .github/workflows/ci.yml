name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Check production environment
        run: pnpm check:deploy
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_PUBLIC_API_BASE_URL: https://example.com
          API_BASE_URL: https://example.com
          NEXT_PUBLIC_TUTOR_NAME: CI Tutor
          NEXT_PUBLIC_TUTOR_ABOUT: CI tutor description
          NEXT_PUBLIC_TUTOR_EMAIL: ci@example.com
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_PUBLIC_API_BASE_URL: https://example.com
          API_BASE_URL: https://example.com
          NEXT_PUBLIC_TUTOR_NAME: CI Tutor
          NEXT_PUBLIC_TUTOR_ABOUT: CI tutor description
          NEXT_PUBLIC_TUTOR_EMAIL: ci@example.com

  backend-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: site_bank
          POSTGRES_PASSWORD: site_bank_test
          POSTGRES_DB: site_bank_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U site_bank -d site_bank_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://site_bank:site_bank_test@localhost:5432/site_bank_test
      DATABASE_URL: postgresql+asyncpg://site_bank:site_bank_test@localhost:5432/site_bank_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run pytest
