name: site-bank

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - internal

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?set NEXT_PUBLIC_API_BASE_URL}
        API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?set NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_TUTOR_NAME: ${NEXT_PUBLIC_TUTOR_NAME:?set NEXT_PUBLIC_TUTOR_NAME}
        NEXT_PUBLIC_TUTOR_TELEGRAM: ${NEXT_PUBLIC_TUTOR_TELEGRAM:-}
        NEXT_PUBLIC_TUTOR_EMAIL: ${NEXT_PUBLIC_TUTOR_EMAIL:-}
        NEXT_PUBLIC_TUTOR_PHOTO: ${NEXT_PUBLIC_TUTOR_PHOTO:-}
        NEXT_PUBLIC_TUTOR_VIDEO: ${NEXT_PUBLIC_TUTOR_VIDEO:-}
        NEXT_PUBLIC_TUTOR_ABOUT: ${NEXT_PUBLIC_TUTOR_ABOUT:?set NEXT_PUBLIC_TUTOR_ABOUT}
        NEXT_PUBLIC_YM_ID: ${NEXT_PUBLIC_YM_ID:-}
    restart: unless-stopped
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_TUTOR_NAME: ${NEXT_PUBLIC_TUTOR_NAME}
      NEXT_PUBLIC_TUTOR_TELEGRAM: ${NEXT_PUBLIC_TUTOR_TELEGRAM:-}
      NEXT_PUBLIC_TUTOR_EMAIL: ${NEXT_PUBLIC_TUTOR_EMAIL:-}
      NEXT_PUBLIC_TUTOR_PHOTO: ${NEXT_PUBLIC_TUTOR_PHOTO:-}
      NEXT_PUBLIC_TUTOR_VIDEO: ${NEXT_PUBLIC_TUTOR_VIDEO:-}
      NEXT_PUBLIC_TUTOR_ABOUT: ${NEXT_PUBLIC_TUTOR_ABOUT}
      NEXT_PUBLIC_YM_ID: ${NEXT_PUBLIC_YM_ID:-}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - deploy/.env.production
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-site_bank}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.28.0.0/16}
    expose:
      - "8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-site_bank}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
