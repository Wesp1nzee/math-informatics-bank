<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
  <title id="title">Касательная к графику функции</title>
  <desc id="desc">В точке x0 проведена касательная. Её наклон равен значению производной f′(x0).</desc>

  <g font-family="Inter, system-ui, sans-serif">
    <!-- grid -->
    <g stroke="#d8d8d2" stroke-width="1" opacity="0.7">
      <line x1="80" y1="80" x2="740" y2="80"/>
      <line x1="80" y1="160" x2="740" y2="160"/>
      <line x1="80" y1="240" x2="740" y2="240"/>
      <line x1="80" y1="320" x2="740" y2="320"/>
      <line x1="180" y1="50" x2="180" y2="410"/>
      <line x1="300" y1="50" x2="300" y2="410"/>
      <line x1="420" y1="50" x2="420" y2="410"/>
      <line x1="540" y1="50" x2="540" y2="410"/>
      <line x1="660" y1="50" x2="660" y2="410"/>
    </g>

    <!-- axes -->
    <line x1="80" y1="390" x2="740" y2="390" stroke="#8b8b84" stroke-width="1.5"/>
    <line x1="80" y1="50" x2="80" y2="390" stroke="#8b8b84" stroke-width="1.5"/>
    <text x="728" y="412" fill="#8b8b84" font-size="14">x</text>
    <text x="64" y="62" fill="#8b8b84" font-size="14">y</text>

    <!-- curve f(x) -->
    <path d="M 100 350 C 210 355 270 300 360 235 C 450 170 530 120 690 78"
          fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
    <text x="640" y="64" fill="#111111" font-size="17" font-style="italic">f(x)</text>

    <!-- tangent at x0 -->
    <line x1="250" y1="360" x2="570" y2="140" stroke="#3157d5" stroke-width="2.5" stroke-linecap="round"/>
    <text x="578" y="136" fill="#3157d5" font-size="16">касательная</text>

    <!-- point x0 -->
    <line x1="408" y1="196" x2="408" y2="390" stroke="#3157d5" stroke-width="1.2" stroke-dasharray="4 5" opacity="0.7"/>
    <circle cx="408" cy="196" r="8" fill="#3157d5" stroke="#ffffff" stroke-width="3"/>
    <text x="398" y="416" fill="#3157d5" font-size="16">x₀</text>

    <!-- slope callout -->
    <rect x="470" y="250" width="246" height="82" rx="10" fill="#e9edff"/>
    <text x="490" y="280" fill="#3157d5" font-size="15" font-weight="600">наклон прямой</text>
    <text x="490" y="308" fill="#2547b8" font-size="17">f′(x₀) = тангенс угла</text>
    <text x="490" y="322" fill="#2547b8" font-size="13">наклона касательной</text>

    <!-- rise / run hint -->
    <line x1="300" y1="300" x2="420" y2="300" stroke="#208a5a" stroke-width="1.5" stroke-dasharray="3 4"/>
    <line x1="420" y1="300" x2="420" y2="200" stroke="#208a5a" stroke-width="1.5" stroke-dasharray="3 4"/>
    <text x="338" y="292" fill="#208a5a" font-size="13">Δx</text>
    <text x="428" y="258" fill="#208a5a" font-size="13">Δy</text>
  </g>
</svg>
